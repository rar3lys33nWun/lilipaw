name: Network Audit

on: [push]

jobs:
  run-audit:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install Packages
      run: npm install

    - name: Install Browser
      run: npx playwright install --with-deps chromium

    - name: Run Script
      run: node index.js
